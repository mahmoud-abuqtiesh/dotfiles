# Font + cursor.
# MesloLGS NF is the p10k-recommended Meslo variant. Install instructions in README.
# Override font_size per machine in kitty-custom.conf (e.g. laptop hi-DPI).

font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# Disable ligatures everywhere (MesloLGS NF doesn't have them anyway, but be explicit).
disable_ligatures always

cursor_shape          block
cursor_blink_interval 0
