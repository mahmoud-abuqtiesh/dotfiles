# Keybindings.
# kitty_mod = ctrl+shift (default).
#
# All non-default binds below are checked against the kitty 0.32 default set
# and your three pre-existing binds. No conflicts.

# --- Preserved from your previous kitty.conf ---
map ctrl+shift+t     launch --cwd=current --type=tab
map ctrl+shift+enter launch --cwd=current --type=window
map ctrl+shift+y     new_tab

# --- Splits (requires `enabled_layouts splits,...` in ui.conf) ---
# Backslash and apostrophe are unused in kitty defaults.
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+'     launch --location=hsplit --cwd=current

# --- Quick SSH to dev box (one keystroke) ---
map ctrl+shift+d     launch --type=tab --tab-title="dev" kitten ssh dev@development-mahmoudabuqteish

# ============================================================================
# Useful kitty defaults (no override needed, listed for reference)
# ============================================================================
#
# Hints (no mouse needed):
#   ctrl+shift+e        Open URL on screen
#   ctrl+shift+p > f    Insert path at cursor
#   ctrl+shift+p > shift+l  Copy line to clipboard
#   ctrl+shift+p > w    Insert word at cursor
#   ctrl+shift+p > h    Insert hash at cursor (great for git/docker)
#   ctrl+shift+p > n    Insert line number at cursor
#
# Layouts / windows (panes within a tab):
#   ctrl+shift+space    Cycle layout (splits ↔ stack = zoom focused pane)
#   ctrl+shift+]/[      Next / previous window in tab
#   ctrl+shift+f/b      Move window forward / backward
#   ctrl+shift+1..9     Jump to window N
#   ctrl+shift+r        Start interactive resize
#   ctrl+shift+w        Close window
#
# Tabs:
#   ctrl+shift+right/left  Next / previous tab
#   ctrl+shift+,/.         Move tab backward / forward
#   ctrl+shift+q           Close tab
#   ctrl+shift+alt+t       Set tab title
#
# Scrollback (with shell_integration):
#   ctrl+shift+z/x      Jump to previous / next shell prompt
#   ctrl+shift+h        Open scrollback in pager (less)
#   ctrl+shift+/        Search scrollback
#   ctrl+shift+g        Show last command output
#
# Misc:
#   ctrl+shift+f5       Reload config
#   ctrl+shift+u        Unicode input
#   ctrl+shift+f2       Edit kitty.conf in $EDITOR
#   ctrl+shift+esc      Open kitty shell (kitty's own debug REPL)
#   ctrl+shift+f11      Toggle fullscreen
