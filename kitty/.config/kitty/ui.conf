# Window, tabs, layouts, bell, mouse, scrollback, performance.

# --- Window ---
window_padding_width    4
background_opacity      1.0
# Only prompt on close if a remote shell or non-shell process is active.
confirm_os_window_close -1

# --- Tabs ---
# tab_bar_style left at default ("fade") per preference — no override.
tab_title_template  "{index}: {title}"
tab_activity_symbol "● "
bell_on_tab         "🔔 "

# --- Layouts ---
# splits = arbitrary panes within a tab.
# stack  = focused-pane fullscreen toggle. Cycle layouts with ctrl+shift+space.
enabled_layouts splits,stack

# --- Bell ---
enable_audio_bell    no
visual_bell_duration 0.15
window_alert_on_bell yes

# --- Mouse / clipboard ---
copy_on_select        clipboard
strip_trailing_spaces smart

# --- Scrollback ---
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Shell integration (full) ---
shell_integration enabled

# --- Remote control (enables `kitty @` scripting and quick-access kitten) ---
allow_remote_control yes
listen_on            unix:@kitty-{kitty_pid}

# Auto-reload on config file changes is enabled via the `--watch-config` launch
# flag, applied through kitty's .desktop entry. See README "Auto-reload" section.
