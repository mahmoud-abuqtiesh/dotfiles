# kitty.conf — entrypoint
# Modular config; per-machine overrides go in kitty-custom.conf (gitignored).
# Reload manually with ctrl+shift+f5 (also auto-reloads on save).

include theme.conf
include fonts.conf
include ui.conf
include keys.conf

# kitten ssh remote-sync rules live in ssh.conf and are loaded by `kitten ssh`,
# not by kitty itself, so we don't `include` it here.

# Per-machine overrides — last wins. Absolute path because kitty.conf is a
# symlink (managed by stow) and relative includes resolve against the symlink
# target (the dotfiles repo), not ~/.config/kitty/.
include ${HOME}/.config/kitty/kitty-custom.conf
