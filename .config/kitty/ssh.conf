# kitten ssh — copy local shell config to remote sessions automatically.
# Read by `kitten ssh <host>`, not by kitty itself.
# Reference: https://sw.kovidgoyal.net/kitty/kittens/ssh/

# Default for ALL hosts: bring zsh aliases + .zshrc with you so prompt and
# aliases follow you onto any server. Files land in $HOME on the remote.
hostname *
copy --glob $HOME/.config/zsh/*
copy $HOME/.zshrc

# Per-host overrides go here later, e.g.:
# hostname dev@development-mahmoudabuqteish
# copy $HOME/.config/something
