# kitty.conf — entrypoint
# Modular config; per-machine overrides go in kitty-custom.conf (gitignored).
# Reload manually with ctrl+shift+f5 (also auto-reloads on save).

include theme.conf
include fonts.conf
include ui.conf
include keys.conf

# Per-machine overrides — last wins. Relative, so it resolves against the
# symlink target (the dotfiles repo), where the gitignored file lives.
# globinclude rather than include: silent when the file doesn't exist.
globinclude kitty-custom.conf
